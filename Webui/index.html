<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Yaya Tespit Sistemi | HOG+SVM</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #e2e8f0;
      color: #1a1f36;
      margin: 0;
      /* Ekranın tamamını kullanması için sıfırlamalar */
      padding: 2vh 2vw; 
      height: 100vh;
      overflow: hidden; /* Dış kaydırma çubuğunu gizle */
      box-sizing: border-box;
    }

    .main-card {
      border: none;
      border-radius: 16px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.15);
      background: white;
      height: 100%; /* Ekran yüksekliğini tamamen doldur */
      overflow: hidden;
    }

    .sidebar-panel {
      background-color: #ffffff;
      border-right: 1px solid #edf2f7;
      padding: 30px 25px;
      height: 100%;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .header-title {
      font-weight: 700;
      color: #10b981;
      letter-spacing: -1px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 15px;
      transition: all 0.3s ease;
      text-align: center;
    }

    .stat-card:hover {
      border-color: #10b981;
      transform: translateY(-2px);
    }

    .stat-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
    }

    .stat-value {
      font-size: 1.8rem;
      font-weight: 700;
      color: #10b981;
      margin-top: 5px;
    }

    #btnDetect {
      background-color: #10b981;
      border: none;
      font-weight: 600;
      padding: 14px;
      font-size: 1.1rem;
      border-radius: 10px;
      transition: all 0.3s ease;
    }

    #btnDetect:hover:not(:disabled) {
      background-color: #059669;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }

    .canvas-container {
      background-color: #0f172a; /* Daha koyu ve profesyonel bir arka plan */
      height: 100%;
      padding: 20px;
    }

    .image-box {
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .image-wrapper {
      flex: 1;
      min-height: 0; /* Flexbox içinde resmin taşmasını engeller */
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }

    /* Resimlerin oranını bozmadan en büyük boyuta ulaşmasını sağlar */
    canvas, #hogImg {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 6px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .api-badge {
      font-size: 0.75rem;
      background: #eef2ff;
      color: #4f46e5;
      padding: 6px 12px;
      border-radius: 6px;
      word-break: break-all;
      display: block;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="container-fluid h-100 p-0">
  <div class="main-card row g-0">
    
    <div class="col-xl-2 col-lg-3 sidebar-panel">
      <h2 class="header-title">VisionAI <small class="text-muted fw-light fs-5">v1.0</small></h2>
      
      <div class="mb-4">
        <label class="form-label small fw-bold text-secondary">Görüntü Yükle</label>
        <input class="form-control" type="file" id="fileInput" accept="image/*">
      </div>

      <button id="btnDetect" class="btn btn-primary w-100 mb-4" disabled>
        Taramayı Başlat
      </button>

      <div class="row g-3 flex-grow-1">
        <div class="col-6">
          <div class="stat-card">
            <div class="stat-label">Ham Aday</div>
            <div id="raw" class="stat-value">-</div>
          </div>
        </div>
        <div class="col-6">
          <div class="stat-card">
            <div class="stat-label">NMS</div>
            <div id="nms" class="stat-value">-</div>
          </div>
        </div>
        <div class="col-12">
          <div class="stat-card">
            <div class="stat-label">İşlem Süresi (ms)</div>
            <div id="lat" class="stat-value">-</div>
          </div>
        </div>
        <div class="col-12">
          <div class="stat-card">
            <div class="stat-label">Bulunan Kişi (Kutu)</div>
            <div id="kcount" class="stat-value">-</div>
          </div>
        </div>
      </div>

    </div>

    <div class="col-xl-10 col-lg-9 canvas-container">
      <div class="row h-100 m-0">
        
        <div class="col-6 image-box pe-3">
          <h5 class="text-white mb-2 mt-2 text-center fw-light">İnsan Tespiti (SVM Kararı)</h5>
          <div class="image-wrapper">
            <canvas id="cv"></canvas>
          </div>
        </div>

        <div class="col-6 image-box border-start border-secondary ps-3">
          <h5 class="text-white mb-2 mt-2 text-center fw-light">HOG Haritası (Gradyan Yönleri)</h5>
          <div class="image-wrapper">
            <img id="hogImg" src="" style="display: none;" />
          </div>
        </div>

      </div>
    </div>

  </div>
</div>

<script>
  const API_URL = "http://127.0.0.1:8000/detect";
  const fileInput = document.getElementById("fileInput");
  const btnDetect = document.getElementById("btnDetect");
  const canvas = document.getElementById("cv");
  const ctx = canvas.getContext("2d");
  const hogImg = document.getElementById("hogImg");

  const elRaw = document.getElementById("raw"), elNms = document.getElementById("nms");
  const elLat = document.getElementById("lat"), elKcount = document.getElementById("kcount");

  let currentImage = null, currentFile = null;

  function drawImageToCanvas(img) {
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    ctx.drawImage(img, 0, 0);
  }

  function drawBoxes(detections, topK = 15) {
    const k = Math.min(topK, detections.length);
    for (let i = 0; i < k; i++) {
      const d = detections[i];
      const x = d.xmin, y = d.ymin, w = d.xmax - d.xmin, h = d.ymax - d.ymin;
      
      ctx.lineWidth = 4;
      ctx.strokeStyle = "#10b981";
      ctx.strokeRect(x, y, w, h);

      ctx.fillStyle = "#10b981";
      ctx.fillRect(x, y - 25, 50, 25);
      ctx.font = "bold 16px Inter";
      ctx.fillStyle = "white";
      ctx.fillText(d.score.toFixed(2), x + 5, y - 7);
    }
    elKcount.textContent = String(k);
  }

  fileInput.addEventListener("change", () => {
    const f = fileInput.files?.[0];
    if (!f) return;
    currentFile = f;
    const img = new Image();
    img.onload = () => {
      currentImage = img;
      drawImageToCanvas(img);
      btnDetect.disabled = false;
      
      hogImg.style.display = "none";
      hogImg.src = "";
      
      [elRaw, elNms, elLat, elKcount].forEach(el => el.textContent = "-");
    };
    img.src = URL.createObjectURL(f);
  });

  btnDetect.addEventListener("click", async () => {
    if (!currentFile || !currentImage) return;
    drawImageToCanvas(currentImage);
    const fd = new FormData();
    fd.append("file", currentFile);
    btnDetect.disabled = true;
    btnDetect.textContent = "Analiz Ediliyor...";
    
    hogImg.style.display = "none";

    try {
      const resp = await fetch(API_URL, { method: "POST", body: fd, mode: 'cors' });
      const data = await resp.json();
      elRaw.textContent = data.raw_candidates;
      elNms.textContent = data.nms_candidates;
      elLat.textContent = data.latency_ms;
      drawBoxes(data.detections || [], 5);
      
      if (data.hog_image) {
        hogImg.src = data.hog_image;
        hogImg.style.display = "block";
      }
      
    } catch (e) {
      alert("Hata: " + e.message);
    } finally {
      btnDetect.disabled = false;
      btnDetect.textContent = "Taramayı Başlat";
    }
  });
</script>

</body>
</html>
